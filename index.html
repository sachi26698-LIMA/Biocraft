<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BioCraft — All-in-One Social Media Toolkit</title>
    <meta
      name="description"
      content="Free social media toolkit: Instagram, Facebook, Threads, TikTok, X and LinkedIn — bios, usernames, captions, hashtags, stylish text, symbols and a 324-glyph library. EN &amp; हिन्दी, no sign-up, fully private."
    />
    <meta
      name="keywords"
      content="all-in-one social media toolkit, instagram bio generator, facebook bio, threads bio, tiktok bio, x bio, linkedin headline, linkedin summary, username generator, stylish name generator, fancy font generator, hashtag generator, caption generator, emoji symbols"
    />
    <!--
      Canonical and og:url are intentionally omitted until the production
      domain is known — placeholder domains must not ship.
      Per-route shells (title/description/OG) are generated at build time
      by scripts/build-shells.mjs.
    -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..800&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <meta name="theme-color" content="#FCF9FC" />
    <meta name="author" content="BioCraft" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="BioCraft" />
    <meta property="og:title" content="BioCraft — All-in-One Social Media Toolkit" />
    <meta
      property="og:description"
      content="Free social media toolkit for Instagram, Facebook, Threads, TikTok, X and LinkedIn. EN &amp; हिन्दी, no sign-up, fully private."
    />
    <meta property="og:locale" content="en_IN" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="BioCraft — All-in-One Social Media Toolkit" />
    <meta
      name="twitter:description"
      content="Free social media toolkit for Instagram, Facebook, Threads, TikTok, X and LinkedIn. EN &amp; हिन्दी."
    />

    <!-- Structured data: the app itself -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "BioCraft — All-in-One Social Media Toolkit",
      "description": "Free social media toolkit: bio, stylish name, fancy font, username, hashtag and caption generators plus a 300+ symbol library and LinkedIn headline and summary generators — for Instagram, Facebook, Threads, TikTok, X and LinkedIn. English & Hindi. No sign-up, fully private.",
      "applicationCategory": "UtilitiesApplication",
      "operatingSystem": "Any",
      "offers": { "@type": "Offer", "price": "0", "priceCurrency": "INR" },
      "featureList": [
        "Bio Generator",
        "Stylish Name Generator",
        "Fancy Font Generator",
        "Username Generator",
        "Emoji & Symbol Generator",
        "Hashtag Generator",
        "Caption Generator",
        "LinkedIn Headline Generator",
        "LinkedIn Summary Generator"
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
