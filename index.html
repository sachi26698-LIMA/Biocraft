<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BioCraft — All-in-One Social Media Toolkit</title>
    <meta
      name="description"
      content="Free social media toolkit: Instagram, Facebook, Threads, TikTok, X, LinkedIn, WhatsApp and Snapchat — bios, usernames, captions, hashtags, stylish text, the Design Studio, symbols and a 629-glyph library. English · हिन्दी · Hinglish, no sign-up, fully private."
    />
    <meta
      name="keywords"
      content="all-in-one social media toolkit, instagram bio generator, facebook bio, threads bio, tiktok bio, x bio, linkedin headline, linkedin summary, whatsapp status, snapchat captions, hinglish bio, username generator, stylish name generator, fancy font generator, hashtag generator, caption generator, emoji symbols"
    />
    <!--
      Canonical and og:url are intentionally omitted until the production
      domain is known — placeholder domains must not ship.
      Per-route shells (title/description/OG) are generated at build time
      by scripts/build-shells.mjs.
    -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#FCF9FC" />
    <meta name="author" content="BioCraft" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="BioCraft" />
    <meta property="og:title" content="BioCraft — All-in-One Social Media Toolkit" />
    <meta
      property="og:description"
      content="Free social media toolkit for Instagram, Facebook, Threads, TikTok, X, LinkedIn, WhatsApp and Snapchat — bios, fancy fonts, Design Studio, symbols and more. English · हिन्दी · Hinglish, no sign-up, fully private."
    />
    <meta property="og:locale" content="en_IN" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="BioCraft — All-in-One Social Media Toolkit" />
    <meta
      name="twitter:description"
      content="Free social media toolkit for Instagram, Facebook, Threads, TikTok, X, LinkedIn, WhatsApp and Snapchat — bios, fancy fonts, Design Studio and symbols. English · हिन्दी · Hinglish."
    />

    <!-- Structured data: the app itself -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "BioCraft — All-in-One Social Media Toolkit",
      "description": "Free social media toolkit: bio, stylish name, fancy font, Design Studio, username, hashtag, caption, LinkedIn headline, LinkedIn summary, WhatsApp status and Snapchat caption generators, a Bio Editor, a hand-rolled ready-made bio collection system and a 629-glyph symbol library — for Instagram, Facebook, Threads, TikTok, X, LinkedIn, WhatsApp and Snapchat. English, Hindi and Hinglish. No sign-up, fully private.",
      "applicationCategory": "UtilitiesApplication",
      "operatingSystem": "Any",
      "offers": { "@type": "Offer", "price": "0", "priceCurrency": "INR" },
      "featureList": [
        "Bio Generator",
        "Stylish Name Generator",
        "Fancy Font Generator",
        "Username Generator",
        "Emoji & Symbol Generator",
        "Hashtag Generator",
        "Caption Generator",
        "LinkedIn Headline Generator",
        "LinkedIn Summary Generator",
        "WhatsApp Status Generator",
        "Snapchat Caption Generator",
        "Design Studio",
        "Bio Editor",
        "Ready-Made Bio Collections"
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
